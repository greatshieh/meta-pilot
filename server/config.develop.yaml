# Global Configuration
# jwt configuration
jwt:
  signing-key: meta-pilot
  expires-time: 7d
  buffer-time: 1d
  issuer: meta-pilot

# zap logger configuration
zap:
  level: info
  format: console
  prefix: "[MPA-zap]"
  director: log
  show-line: true
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: true

# redis configuration
redis:
  db: 0
  addr: 127.0.0.1:6379
  password: "forest"

# email configuration
email:
  port: 465
  to: xxx@foxmail.com
  from: xxx@qq.com
  host: smtp.qq.com
  is-ssl: true
  secret: xxx
  nickname: test

# system configuration
system:
  name: MetaPilot
  env: develop # Change to "develop" to skip authentication for development mode
  addr: 8888
  db-type: mysql
  oss-type: huawei
  use-redis: true # 使用redis
  use-multipoint: false
  # 路由全局前缀
  router-prefix: api
  # 系统及路由全局前缀，即 `pkg` 目录下的路由，用于区别自定义路由
  system-router-prefix: ""
  # 需要注册的全局中间件, 用","隔开
  middleware: recovery,cors
  # 需要注册的插件, 用","隔开
  plugins: email
  #  严格角色模式 打开后权限将会存在上下级关系
  use-strict-auth: false
  #  禁用自动迁移数据库表结构，生产环境建议设为true，手动迁移
  disable-auto-migrate: false

# 限流器
ratelimiter:
  # 限流器类型, router - 路由限流器, ip - IP限流器
  - type: router
    rules:
      # 当类型为router时, 定义需要限流的路径; 当类型为ip时, 可以为空
      - key: /article
        # 限流器的间隔时间, 即过期时间
        interval: 60
        # 限流器容量
        capacity: 2
        # 当类型为router时, 为每interval时间往bucket中放入的令牌数
        quantum: 2

# mysql connect configuration
mysql:
  path: localhost
  port: 3306
  config: charset=utf8mb4&parseTime=True&loc=Local
  db-name: metapilot
  username: forest
  password: forest
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: info
  log-zap: false

# sqlite配置
sqlite:
  path: ./db
  db-name: db.sqlite3
  log-mode: info
  log-zap: false

# pgsql connect configuration
pgsql:
  path: ""
  port: ""
  config: ""
  db-name: ""
  username: ""
  password: ""
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: ""
  log-zap: false

db-list:
  - disable: true # 是否禁用
    type: "" # 数据库的类型,目前支持mysql、pgsql
    alias-name: "" # 数据库的名称,注意: alias-name 需要在db-list中唯一
    path: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false

cors:
  mode: whitelist # 放行模式: allow-all, 放行全部; whitelist, 白名单模式, 来自白名单内域名的请求添加 cors 头; strict-whitelist 严格白名单模式, 白名单外的请求一律拒绝
  whitelist:
    - allow-origin: 127.0.0.1
      allow-headers: Content-Type, AccessToken, X-CSRF-Token,Authorization, Token, X-Token, X-User-Id
      allow-methods: POST, GET
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type

github:
  token: xxx

# 微信平台配置
wechat:
  appid: xxxxxx
  appsecret: xxxxxx
  token: meta-pilot-token # 预留的token，和公众平台一致

# 华为云短信配置
huaweiSMS:
  ak: xxxxxxxxxxxxxx
  sk: xxxxxxxxxxxxxx
  apiaddress: https://xxxxxxx.xxxxxxxxx.myhuaweicloud.com:443/sms/batchSendSms/v1 # APP接入地址(在控制台"应用管理"页面获取)+接口访问URI
  sender: xxxxxxxxxxx # 国内短信签名通道号
  signature: xxxxxxxxxxx # 签名名称
  templateId: xxxxxxxxxxxxxx # 模板ID
  statusCallBack: "" # 选填,短信状态报告接收地址,推荐使用域名,为空或者不填表示不接收状态报告

# 七牛云配置
qiniukodo:
  zone: ZoneHuaDong
  bucket: xxx-pilot
  img-path: ""
  access-key: xxxxxxxxxxxxxx
  secret-key: xxxxxxxxxxxxxx
  use-https: false
  use-cdn-domains: false

# 华为obs配置
huaweiobs:
  path: xxxxxxx.xxxxxx.xxxxxxx
  bucket: xxx-pilot
  endpoint: https://obs.cn-north-4.myhuaweicloud.com
  access-key: xxxxxxxxxxxxxx
  secret-key: xxxxxxxxxxxxxx
